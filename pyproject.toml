[project]
name = "ai-program-atlas"
version = "0.1.0"
description = "A source-backed atlas of undergraduate artificial intelligence programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
    "protego>=0.7,<0.8",
    "soupsieve>=2.10,<3",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser integration tests (requires Playwright Chromium)"]

[tool.ruff]
line-length = 100
